# Airflow local para orquestrar o pipeline: LocalExecutor com Postgres, sem fila nem workers
# separados, porque as tarefas rodam na mesma maquina que os dados.
#
#   cd orchestration
#   docker compose up airflow-init
#   docker compose up -d
#   http://localhost:8080  (sem login: so aceita conexoes da propria maquina)
#
# Para publicar na AWS acrescente o arquivo docker-compose.aws.yml (veja orchestration/README.md).

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.4.0}
  image: cnpj-pipeline-airflow:${AIRFLOW_VERSION:-3.4.0}
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    # Tela sem login: valido so porque a porta abaixo escuta apenas em 127.0.0.1.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Segredos locais de desenvolvimento. Fora da propria maquina, defina os valores no .env.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-cnpj-pipeline-local-jwt-secret-change-outside-localhost-0123456789abcdef}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-cnpj-pipeline-local-api-secret-change-outside-localhost}
    # Aponta o pipeline para as pastas montadas abaixo.
    CNPJ_DATA_DIR: /opt/cnpj/data
    PYTHONPATH: /opt/cnpj/src
    CNPJ_S3_BUCKET: ${CNPJ_S3_BUCKET:-}
    CNPJ_AWS_PROFILE: ${CNPJ_AWS_PROFILE:-cnpj-publisher}
    CNPJ_AWS_REGION: ${CNPJ_AWS_REGION:-us-east-1}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dags:/opt/cnpj/orchestration/dags:ro  # para o teste de integridade da DAG
    - airflow-logs:/opt/airflow/logs
    # O repositorio inteiro e visto pelas tarefas: codigo, dados e os relatorios gravados em docs/.
    - ../src:/opt/cnpj/src
    - ../tests:/opt/cnpj/tests
    - ../data:/opt/cnpj/data
    - ../docs:/opt/cnpj/docs
    - ../site/public/data:/opt/cnpj/site/public/data
  depends_on: &airflow-depends-on
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on: *airflow-depends-on

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on: *airflow-depends-on

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on: *airflow-depends-on

volumes:
  postgres-data:
  airflow-logs:

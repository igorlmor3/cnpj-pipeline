[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnpj-pipeline"
version = "0.1.0"
description = "Pipeline ETL para os dados abertos do CNPJ da Receita Federal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "duckdb>=1.1",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
]
agent = [
    "sqlglot>=25.0",
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "sqlglot>=25.0",
    "anthropic>=0.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
